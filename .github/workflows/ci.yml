name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: Build & test (CPU pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        # The GPU runtime/viewer and Python bindings need the Vulkan SDK and
        # pybind11, which aren't available on the runner. Build and test the
        # CPU preprocessing pipeline (formats, meshlets, hierarchy, simplify).
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVGEO_BUILD_VIEWER=OFF
          -DVGEO_BUILD_PYTHON=OFF
          -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
